<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mozunitor · 常驻服务监控</title>
<script>
// 主题在样式表之前落定，避免首屏闪一下默认皮肤；值来自 themes.js 的 localStorage 键。
try {
  var t = localStorage.getItem('mozunitor.theme');
  if (t && t !== 'cyan') document.documentElement.dataset.theme = t;
} catch (e) { /* 隐私模式读不到就用默认 */ }
</script>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/themes.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="statusbar" id="statusbar">
  <button class="brand" id="brand" type="button" aria-label="Mozunitor 状态" title="双击定位到异常服务">
    <span class="brand-mark" id="brand-mark" data-state="ok" aria-hidden="true">
      <svg class="mark-svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
        <g class="mark-frame">
          <rect x="1" y="1" width="6" height="2"/><rect x="9" y="1" width="6" height="2"/>
          <rect x="1" y="3" width="2" height="4"/><rect x="13" y="3" width="2" height="4"/>
          <rect x="1" y="9" width="2" height="4"/><rect x="13" y="9" width="2" height="4"/>
          <rect x="1" y="13" width="6" height="2"/><rect x="9" y="13" width="6" height="2"/>
        </g>
        <rect class="mark-pupil" x="6" y="6" width="4" height="4"/>
      </svg>
      <span class="caret" aria-hidden="true">_</span>
    </span>
  </button>
  <span class="status-node" id="status-node">—</span>
  <div class="status-facts">
    <span class="stat" id="stat-core" data-tone="muted">核心异常 —</span>
    <span class="stat" id="stat-normal" data-tone="muted">常驻异常 —</span>
    <span class="stat" id="stat-peers" data-tone="muted">对端 —</span>
  </div>
  <span class="status-stamp" id="stamp">—</span>
  <button id="refresh" class="btn btn-sm" type="button">刷新</button>
  <button id="open-settings" class="btn btn-sm" type="button">设置</button>
</header>

<div class="warnings" id="warnings"></div>

<section class="pinned hidden" id="pinned">
  <div class="pinned-head"><span>置顶</span><span class="count" id="pinned-count"></span></div>
  <div class="pinned-body" id="pinned-body"></div>
</section>

<main class="workspace workspace--dash" id="workspace">
  <section class="panel panel-board">
    <h2 class="panel-title">
      <span class="panel-heading">服务总览</span>
      <span class="count" id="board-count">—</span>
    </h2>
    <div class="board" id="board"><div class="empty">载入中…</div></div>
  </section>

  <aside class="panel side hidden" id="side">
    <div class="side-head panel-title">
      <h2 id="side-name">服务详情</h2>
      <span id="side-sub" class="side-sub"></span>
      <button id="side-close" class="btn side-close" type="button" aria-label="收起详情" title="收起详情（Esc）">›</button>
    </div>
    <div id="side-body" class="detail hidden"></div>
  </aside>
</main>

<div id="settings" class="modal settings hidden">
  <div class="settings-box modal-box" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-head">
      <h2 id="settings-title">Mozunitor 设置</h2>
      <button id="settings-close" class="modal-close" type="button" aria-label="关闭">×</button>
    </div>
    <div id="settings-body" class="modal-body"></div>
  </div>
</div>

<div id="gate" class="modal hidden">
  <form class="gate-card modal-box" id="gate-form">
    <div class="modal-head">
      <h2 id="gate-title">需要访问凭据</h2>
    </div>
    <div class="modal-body">
      <p id="gate-desc">回环访问同样需要登录。输入管理员口令；首次运行先完成初始化。</p>
      <label class="field">
        <span class="field-label">口令</span>
        <input id="gate-pass" type="password" autocomplete="current-password"
               autocapitalize="off" spellcheck="false" placeholder="管理员口令">
      </label>
      <label class="field hidden" id="gate-pass2-field">
        <span class="field-label">确认口令</span>
        <input id="gate-pass2" type="password" autocomplete="new-password"
               autocapitalize="off" spellcheck="false" placeholder="再次输入口令">
      </label>
      <p id="gate-err" class="gate-err" role="alert"></p>
      <p class="hint" id="gate-hint">口令只以 scrypt 派生值落盘；初始化后本窗口自动登录。</p>
    </div>
    <div class="modal-foot gate-foot">
      <button id="gate-later" type="button" class="btn hidden">稍后再说</button>
      <button id="gate-go" type="submit" class="btn btn-primary">进入</button>
    </div>
  </form>
</div>

<div id="confirm" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-head">
      <h2 id="confirm-title">确认操作</h2>
      <button id="confirm-x" class="modal-close" type="button" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <p class="modal-confirm" id="confirm-msg"></p>
      <div class="rule rule--warning" id="confirm-rule">
        <div class="rule-top">
          <span class="badge badge--warning" id="confirm-badge">后果</span>
          <span class="rule-code" id="confirm-code">ACTION</span>
        </div>
        <p class="rule-msg" id="confirm-detail"></p>
      </div>
      <p class="modal-step">执行后不可撤销</p>
    </div>
    <div class="modal-foot">
      <button class="btn" id="confirm-no" type="button">取消</button>
      <button class="btn btn-danger" id="confirm-yes" type="button">确认</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" data-show="false"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
